# GitHub Actions — 코드 push 시 EC2에 자동 배포 (Phase 6 CI/CD)
#
# 흐름: week11에 push → GitHub이 이 워크플로를 자동 실행 → SSH로 EC2에 접속
#       → git pull(최신 코드) → docker compose 재빌드 → /health로 배포 성공 확인.
#
# 필요한 GitHub Secrets (레포 Settings → Secrets and variables → Actions):
#   EC2_HOST    : EC2 퍼블릭 IP
#   EC2_USER    : ubuntu
#   EC2_SSH_KEY : princess-key.pem 파일 내용 전체 (개인키)

name: Deploy to EC2

on:
  push:
    branches: [week11]      # week11에 push하면 실행
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼도 제공

jobs:
  deploy:
    runs-on: ubuntu-latest   # GitHub이 빌려주는 임시 리눅스에서 실행
    steps:
      - name: SSH로 EC2에 접속해 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/project
            git pull origin week11          # 최신 코드 받기
            docker compose up --build -d     # 새 코드로 재빌드 + 교체
            sleep 8
            curl -f http://localhost:8000/health   # 200 아니면 배포 실패 처리
