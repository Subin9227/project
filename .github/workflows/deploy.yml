# GitHub Actions — 코드 push 시 EC2에 자동 배포 (Phase 6 CI/CD)
#
# 흐름: main에 push → GitHub이 이 워크플로를 자동 실행 → SSH로 EC2에 접속
#       → git pull(최신 코드) → docker compose 재빌드 → /health로 배포 성공 확인.
#
# 필요한 GitHub Secrets (레포 Settings → Secrets and variables → Actions):
#   EC2_HOST    : EC2 퍼블릭 IP
#   EC2_USER    : ubuntu
#   EC2_SSH_KEY : princess-key.pem 파일 내용 전체 (개인키)
#
# ⚠️ .env는 CI가 건드리지 않는다. EC2에 직접 scp로 올려야 한다.
#    특히 CRED_KEY가 로컬과 다르면 EC2가 기존 등록을 못 읽는다.
# ⚠️ 로컬 봇과 EC2 봇을 동시에 켜면 안 된다 — 같은 디스코드 토큰으로 두 번 붙는다.

name: Deploy to EC2

on:
  push:
    branches: [main]         # main에 push하면 실행 (예전엔 week11)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼도 제공

jobs:
  deploy:
    runs-on: ubuntu-latest   # GitHub이 빌려주는 임시 리눅스에서 실행
    steps:
      - name: SSH로 EC2에 접속해 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/project
            git pull origin main            # 최신 코드 받기
            docker compose up --build -d     # 새 코드로 재빌드 + 교체
            # /health가 뜰 때까지 최대 90초 재시도 (봇 기동에 시간이 걸림)
            echo "waiting for /health ..."
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8000/health; then
                echo " -> healthy ✅"
                exit 0
              fi
              sleep 3
            done
            echo "health check 실패 — 최근 로그:"
            docker compose logs --tail=40
            exit 1
